name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - name: Format check
        if: runner.os == 'Linux'
        run: zig fmt --check build.zig build.zig.zon src libs examples tools
      - name: Tests
        run: zig build test
      - name: Release build
        run: zig build -Doptimize=ReleaseFast
